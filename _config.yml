title: Aram Davtyan
name: Aram Davtyan
position: Postdoctoral Researcher
email: aram.davtyan@unibe.ch
tagline: "Postdoctoral researcher in generative AI, computer vision, controllable generation, and world models."
description: >-
  I am a Postdoctoral Researcher in the [Computer Vision Group](https://cvg.unibe.ch) at the [University of Bern](https://unibe.ch), working on generative AI, controllable video generation, and world models. I am especially interested in models that learn reusable world representations from the visual experience, going beyond plausible synthesis to support couterfactual intervention, generalization, visual intelligence, adaptation to new tasks, and beyond.

  I earned my Ph.D. in Computer Science from the University of Bern in 2024, advised by [Prof. Dr. Paolo Favaro](https://cvg.unibe.ch/people/favaro). Before that, I completed a Specialist degree in Fundamental Mathematics and Mechanics at [Lomonosov Moscow State University](https://msu.ru/en/) and studied data analysis at [YSDA](https://dataschool.yandex.com/).
